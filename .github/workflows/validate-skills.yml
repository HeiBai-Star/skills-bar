name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate portable Skill format
        run: python scripts/validate_skills.py
      - name: Check generated registry and catalogs
        run: python scripts/build_skills.py --check
      - name: Test authoring and packaging behavior
        run: python -m unittest discover -s tests -v
      - name: Check scoring helper
        run: python skills/decision-model-builder/scripts/score_options.py --help
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw scripts/install.ps1))'
      - name: Build Skill archives
        run: python scripts/build_skills.py --package
      - name: Upload Skill archives
        uses: actions/upload-artifact@v4
        with:
          name: skills-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
